name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: dekotlinizer
          path: build/libs/*.jar

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Repository secrets, read by the publishing block of build.gradle.kts.
      - run: ./gradlew publish
        env:
          RELEASE_REPO_USERNAME: ${{ secrets.RELEASE_REPO_USERNAME }}
          RELEASE_REPO_PASSWORD: ${{ secrets.RELEASE_REPO_PASSWORD }}
